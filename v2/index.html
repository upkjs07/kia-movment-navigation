<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Movement Navigator — v2</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#05070A}
  body{font-family:Pretendard,-apple-system,system-ui,sans-serif;color:#F4F2ED;
       -webkit-font-smoothing:antialiased}
  ::selection{background:transparent;color:inherit}

  #road{position:fixed;inset:0;width:100vw;height:100dvh;display:block}

  /* ── the question rides above the road, the answers are painted on it ── */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:2;
       display:flex;flex-direction:column;justify-content:flex-start;
       padding:clamp(22px,4.2vh,44px) clamp(18px,4vw,44px)}
  #hud::before{content:"";position:absolute;left:0;right:0;top:0;height:42%;
       background:linear-gradient(to bottom,rgba(4,6,10,.92),rgba(4,6,10,.62) 46%,rgba(4,6,10,0));
       z-index:-1}

  #step{font-size:clamp(10px,1.1vw,12px);letter-spacing:.24em;opacity:.5;font-weight:700}
  #q{margin-top:10px;font-size:clamp(20px,3.1vw,38px);font-weight:700;
     letter-spacing:-.02em;line-height:1.3;max-width:20ch;text-wrap:pretty}
  #hint{margin-top:14px;font-size:clamp(11px,1.15vw,13px);letter-spacing:.04em;opacity:.44}

  /* six marks that fill in as the drive goes on */
  #pips{position:fixed;left:50%;bottom:clamp(18px,3.2vh,30px);transform:translateX(-50%);
        display:flex;gap:8px;z-index:3;pointer-events:none}
  #pips i{width:26px;height:3px;border-radius:2px;background:rgba(244,242,237,.22);
          transition:background .4s ease}
  #pips i.on{background:#F4F2ED}

  #start{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:26px;text-align:center;
         background:radial-gradient(ellipse at 50% 60%,rgba(5,7,10,.4),rgba(5,7,10,.9));
         transition:opacity .6s ease}
  #start.gone{opacity:0;pointer-events:none}
  #start h1{font-size:clamp(28px,5vw,58px);font-weight:700;letter-spacing:-.03em;line-height:1.2}
  #start p{font-size:clamp(12px,1.4vw,16px);opacity:.6;line-height:1.7}
  #go{padding:.7em 1.6em;border:none;background:#F4F2ED;color:#05070A;cursor:pointer;
      font-family:inherit;font-weight:700;font-size:clamp(14px,1.5vw,17px);letter-spacing:-.01em}
  #go:hover{background:#fff}
</style>
</head>
<body>

<canvas id="road"></canvas>

<div id="hud">
  <div id="step">QUESTION 1 / 6</div>
  <p id="q"></p>
  <p id="hint">마우스를 좌우로 움직여 차선을 고르세요</p>
</div>

<div id="pips"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<div id="start">
  <h1>2027년 당신은<br>어디로 움직일까요?</h1>
  <p>여섯 번의 갈림길. 한 번의 도착.<br>차를 몰아 차선을 고르면 그게 당신의 답입니다.</p>
  <button id="go">출발하기</button>
</div>

<script>
(function () {
  'use strict';

  // ── the six forks ──
  const QS = [
    { q:'새해를 앞둔 마지막 1분,<br>어떤 생각이 떠오르나요?',
      a:['내년엔 어디까지 가볼까', '올해도 수고했어, 이제 좀 쉬자'] },
    { q:'갑자기 오늘 약속이<br>다 취소되었다면?',
      a:['겉옷부터 입는다', '이불 속으로 들어간다'] },
    { q:'내년 이맘때,<br>가장 듣고 싶은 말은?',
      a:['많은 걸 경험했네', '나를 잘 챙겼네'] },
    { q:'새 다이어리를 샀다.<br>가장 먼저 하는 일은?',
      a:['월별 목표를 채운다', '한 줄 쓰고 덮는다'] },
    { q:'갑자기 내일 여행을<br>가게 됐다. 짐은?',
      a:['일정부터 정리한다', '일단 싸고 본다'] },
    { q:'공들여 짠 계획이<br>첫날부터 틀어졌다.',
      a:['플랜 B 가동', '오히려 좋아'] }
  ];

  // ── night gives way to morning across the six answers ──
  const SKY = [
    { road:'#0B0E13', edge:'#05070A', line:0.50, amb:'#0A0D12' },
    { road:'#0C1016', edge:'#06080C', line:0.52, amb:'#0C1017' },
    { road:'#0E131A', edge:'#080B11', line:0.55, amb:'#111826' },
    { road:'#141A23', edge:'#0C1119', line:0.58, amb:'#1B2636' },
    { road:'#1D242E', edge:'#141B25', line:0.62, amb:'#2E3B4C' },
    { road:'#2A323D', edge:'#202833', line:0.68, amb:'#4E5A69' },
    { road:'#3C444F', edge:'#333B46', line:0.76, amb:'#8892A0' }
  ];

  const cv = document.getElementById('road');
  const ctx = cv.getContext('2d');
  const hudQ = document.getElementById('q');
  const hudStep = document.getElementById('step');
  const pips = document.querySelectorAll('#pips i');
  const startEl = document.getElementById('start');

  let W=0, H=0, dpr=1;
  let roadW=0, roadL=0, roadR=0, carY=0;
  let scrollY=0, lastTs=null, running=false;
  let carX=0, carSpan=0, carYaw=0;
  let pointerS=0.5;
  let asked=0;                       // forks cleared
  const answers=[];
  let snow=0;                        // 0..1, builds as the drive goes on
  let flakes=[];

  const GATE_GAP = 1500;             // road distance between forks
  const GATE_0   = 900;
  const FULL     = 340;              // px per second at cruise
  const BRAKE    = 520;              // road distance spent slowing to the fork
  const STOP_GAP = 130;              // where the car comes to rest, short of the line
  const LAUNCH_MS= 1100;

  let phase = 'run';                 // run · slowing · waiting · launch
  let launchT = 0;
  let pick = -1;                     // lane under consideration while stopped

  const carImg = new Image();
  let carReady=false;
  carImg.onload=function(){ carReady=true; };
  carImg.src='../assets/car_topview.png';

  function lerp(a,b,t){ return a+(b-a)*t; }
  function hx(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
  function mixc(a,b,t){ const x=hx(a),y=hx(b);
    return 'rgb('+Math.round(lerp(x[0],y[0],t))+','+Math.round(lerp(x[1],y[1],t))+','+Math.round(lerp(x[2],y[2],t))+')'; }
  function sky(k){
    const p=Math.max(0,Math.min(6,asked)), i=Math.floor(p), j=Math.min(6,i+1), t=p-i;
    if (k==='line') return lerp(SKY[i].line,SKY[j].line,t);
    return mixc(SKY[i][k],SKY[j][k],t);
  }

  function resize(){
    W=innerWidth; H=innerHeight; dpr=Math.min(devicePixelRatio||1,2);
    cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
    cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    roadW=Math.min(W*0.78,820); roadL=(W-roadW)/2; roadR=roadL+roadW;
    carY=H*0.70;                                   // the car rides low; the road ahead is the screen
    seedFlakes();
  }

  function seedFlakes(){
    flakes=[];
    for(let i=0;i<150;i++) flakes.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.9+0.5, v:Math.random()*40+28, d:Math.random()*20-10
    });
  }

  // ── road paint: text is stretched along the direction of travel, the way
  //    real markings are, so it reads from behind the wheel ──
  function paintText(lines, cx, cy, maxW, alpha){
    const fs=Math.min(maxW/7.2, 46);
    ctx.save();
    ctx.translate(cx,cy);
    ctx.scale(1,1.45);
    ctx.font='700 '+fs+'px Pretendard, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(248,247,242,'+alpha+')';
    const lh=fs*1.16, y0=-(lines.length-1)*lh/2;
    for(let i=0;i<lines.length;i++) ctx.fillText(lines[i], 0, y0+i*lh);
    ctx.restore();
  }
  function wrap(text, per){
    const w=text.split(' '); const out=[]; let cur='';
    for(let i=0;i<w.length;i++){
      const t=cur?cur+' '+w[i]:w[i];
      if(t.length>per && cur){ out.push(cur); cur=w[i]; } else cur=t;
    }
    if(cur) out.push(cur);
    return out;
  }

  function gateY(i){ return GATE_0 + i*GATE_GAP; }

  function drawRoad(){
    ctx.fillStyle=sky('edge'); ctx.fillRect(0,0,W,H);

    // the surface, lighter toward the horizon as the morning comes on
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, sky('amb'));
    g.addColorStop(0.45, sky('road'));
    g.addColorStop(1, sky('edge'));
    ctx.fillStyle=g; ctx.fillRect(roadL,0,roadW,H);

    // snow settles on the tarmac as the night wears on
    if(snow>0.01){
      ctx.save();
      ctx.globalAlpha=snow*0.40;
      ctx.fillStyle='#E8EEF5';
      ctx.fillRect(roadL,0,roadW,H);
      ctx.globalAlpha=snow*0.55;
      for(let i=0;i<70;i++){
        const yy=((i*137+Math.floor(scrollY*0.6))%(H+120))-60;
        const xx=roadL+((i*197)%roadW);
        ctx.fillRect(xx,yy,Math.max(2,roadW*0.03),2.5);
      }
      ctx.restore();
    }

    // shoulders
    ctx.fillStyle='rgba(244,242,237,'+(0.10+snow*0.25)+')';
    ctx.fillRect(roadL-3,0,3,H); ctx.fillRect(roadR,0,3,H);
  }

  function drawLanes(){
    const period=150, off=((scrollY%period)+period)%period;
    const a=sky('line');
    ctx.fillStyle='rgba(250,248,242,'+a+')';
    const lw=Math.max(5,roadW*0.016), x=W/2-lw/2;
    for(let y=off-period;y<H+period;y+=period){
      const top=Math.max(0,y), seg=Math.min(H,y+72)-top;
      if(seg>0) ctx.fillRect(x,top,lw,seg);
    }
  }

  // roadside trees, lit for the season
  function drawTrees(){
    const gap=320;
    const off=((scrollY%gap)+gap)%gap;
    for(let y=off-gap;y<H+gap;y+=gap){
      for(let s=-1;s<=1;s+=2){
        const cx=(s<0?roadL-52:roadR+52), cy=y;
        if(cy<-60||cy>H+60) continue;
        ctx.save(); ctx.translate(cx,cy);
        ctx.fillStyle='#16321F';
        ctx.beginPath(); ctx.arc(0,0,26,0,6.283); ctx.fill();
        ctx.fillStyle='rgba(232,238,245,'+(0.25+snow*0.5)+')';
        ctx.beginPath(); ctx.arc(0,-6,15,0,6.283); ctx.fill();
        const lit=1-Math.min(1,asked/6);
        const dots=[[-12,4],[10,-8],[2,12],[-4,-13],[14,6]];
        for(let d=0;d<dots.length;d++){
          ctx.fillStyle=(d%2?'rgba(228,50,43,':'rgba(255,196,92,')+(0.35+lit*0.55)+')';
          ctx.beginPath(); ctx.arc(dots[d][0],dots[d][1],2.4,0,6.283); ctx.fill();
        }
        ctx.restore();
      }
    }
  }

  // ── the fork: two lanes, each carrying an answer in road paint ──
  function drawGates(){
    for(let i=asked;i<Math.min(QS.length,asked+2);i++){
      const gy=gateY(i);
      const y=carY-(gy-scrollY);                 // where this fork sits on screen
      if(y<-560||y>H+200) continue;

      const near=Math.max(0,Math.min(1,(y+300)/420));
      const a=near*0.92;
      if(a<=0.02) continue;

      // divider through the choice zone
      ctx.fillStyle='rgba(250,248,242,'+(a*0.5)+')';
      ctx.fillRect(W/2-2, y-330, 4, 330);

      const lanes=[roadL+roadW*0.25, roadR-roadW*0.25];
      const live = (i===asked && phase==='waiting');
      for(let s=0;s<2;s++){
        const on = live && pick===s;
        if(live){
          // the lane under consideration is lit like a box junction
          ctx.fillStyle='rgba(250,248,242,'+(on?0.13:0.04)+')';
          ctx.fillRect(s===0?roadL+4:W/2+4, y-330, roadW/2-8, 330);
        }
        paintText(wrap(QS[i].a[s],9), lanes[s], y-165, roadW*0.44, on?a:(live?a*0.55:a));
      }
      ctx.fillStyle='rgba(250,248,242,'+(a*0.75)+')';
      for(let x=roadL+6;x<roadR-6;x+=26) ctx.fillRect(x,y-3,14,6);
    }
  }

  function drawFlakes(){
    ctx.save();
    for(let i=0;i<flakes.length;i++){
      const f=flakes[i];
      const inBeam = f.y>carY-360 && f.y<carY && Math.abs(f.x-(W/2+carX))<180;
      ctx.fillStyle='rgba(255,255,255,'+(inBeam?0.95:0.42)+')';
      ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.283); ctx.fill();
    }
    ctx.restore();
  }

  function drawCar(now){
    if(!carReady) return;
    const h=Math.min(H*0.20,210), w=h*(carImg.width/carImg.height);
    const x=W/2+carX, y=carY;

    // headlights reaching up the road
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const beam=ctx.createLinearGradient(0,y-h*0.4,0,y-h*0.4-340);
    beam.addColorStop(0,'rgba(226,242,255,0.15)');
    beam.addColorStop(0.4,'rgba(200,228,255,0.055)');
    beam.addColorStop(1,'rgba(180,220,255,0)');
    ctx.fillStyle=beam;
    ctx.beginPath();
    ctx.moveTo(x-w*0.30,y-h*0.4); ctx.lineTo(x+w*0.30,y-h*0.4);
    ctx.lineTo(x+w*1.25,y-h*0.4-340); ctx.lineTo(x-w*1.25,y-h*0.4-340);
    ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(x,y); ctx.rotate(carYaw);
    ctx.drawImage(carImg,-w/2,-h/2,w,h);
    ctx.restore();
  }

  const hudHint=document.getElementById('hint');
  function setQuestion(){
    if(asked>=QS.length){
      hudStep.textContent='ARRIVING'; hudQ.innerHTML='도착했습니다';
      hudHint.textContent=''; return;
    }
    hudStep.textContent='QUESTION '+(asked+1)+' / 6';
    hudQ.innerHTML=QS[asked].q;
  }
  function setHint(){
    if(asked>=QS.length){ hudHint.textContent=''; return; }
    hudHint.textContent = (phase==='waiting')
      ? '차선을 고르고 클릭하세요'
      : '앞에 갈림길이 있습니다';
  }

  function frame(ts){
    const now=ts||performance.now();
    if(lastTs===null) lastTs=now;
    let dt=(now-lastTs)/1000; lastTs=now;
    if(!(dt>0)) dt=0; else if(dt>0.1) dt=0.1;

    // ── how fast the road is moving, by phase ──
    let speed = 0;
    if(running && asked<QS.length){
      const stopAt = gateY(asked) - STOP_GAP;
      const d = stopAt - scrollY;
      if(phase==='run'){
        speed = FULL;
        if(d < BRAKE) phase='slowing';
      }
      if(phase==='slowing'){
        speed = Math.max(FULL*0.045, FULL*Math.pow(Math.max(0,d)/BRAKE, 0.85));
        if(d <= 2){ scrollY = stopAt; speed = 0; phase='waiting'; }
      }
      if(phase==='waiting') speed = 0;
      if(phase==='launch'){
        launchT += dt*1000;
        const t = Math.min(1, launchT/LAUNCH_MS);
        speed = FULL * t*t;
        if(t>=1) phase='run';
      }
    } else if(running) {
      speed = FULL;
    }
    scrollY += speed*dt;

    // steering — while stopped the car slides fully into the lane being considered
    carSpan=Math.max(0,roadW*0.42-((carReady?Math.min(H*0.20,210)*(carImg.width/carImg.height):120)/2));
    pick = (phase==='waiting' || phase==='launch') ? (pointerS<0.5?0:1) : -1;
    let tx=(pointerS-0.5)*2*carSpan;
    if(phase==='waiting') tx = (pick===0?-1:1)*carSpan*0.62;
    if(phase==='launch')  tx = (answers[answers.length-1]===0?-1:1)*carSpan*0.62;
    const prev=carX;
    carX+=(tx-carX)*Math.min(1,dt*5.5);
    const vx=(carX-prev)/Math.max(dt,1e-4);
    carYaw+=(Math.max(-0.11,Math.min(0.11,vx*0.0013))-carYaw)*Math.min(1,dt*6);



    // snow drifts, and falls faster the nearer the car
    for(let i=0;i<flakes.length;i++){
      const f=flakes[i];
      f.y+=(f.v+speed*0.25)*dt; f.x+=f.d*dt;
      if(f.y>H+6){ f.y=-6; f.x=Math.random()*W; }
    }

    setHint();
    ctx.clearRect(0,0,W,H);
    drawRoad(); drawLanes(); drawTrees(); drawGates(); drawCar(now); drawFlakes();

    requestAnimationFrame(frame);
  }

  addEventListener('pointermove',function(e){
    if(e.pointerType==='touch') return;
    pointerS=Math.min(1,Math.max(0,e.clientX/(innerWidth||1)));
  },{passive:true});
  addEventListener('resize',resize);

  function commit(){
    if(phase!=='waiting' || asked>=QS.length) return;
    answers.push(pick<0?0:pick);
    pips[asked].classList.add('on');
    asked++;
    snow=Math.min(1,asked/6);
    setQuestion();
    phase='launch'; launchT=0;
  }
  addEventListener('pointerdown', function(e){
    if(startEl.classList.contains('gone')) commit();
  });
  addEventListener('keydown', function(e){
    if(e.key===' '||e.key==='Enter') commit();
  });

  document.getElementById('go').onclick=function(){
    startEl.classList.add('gone');
    running=true;
  };

  resize(); setQuestion();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
